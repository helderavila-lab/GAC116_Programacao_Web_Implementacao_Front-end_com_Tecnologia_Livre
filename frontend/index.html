<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acervo — sistema de gestão de Trabalhos de Conclusão de Curso" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Acervo · Gestão de TCCs</title>
    <script>
      // Aplica o tema salvo antes de o Vue carregar, para a tela não "piscar" clara.
      try {
        var t = localStorage.getItem('tema')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
